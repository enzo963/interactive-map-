<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Local production performance probe</title>
<style>body{font:16px system-ui;margin:1rem}pre{white-space:pre-wrap}iframe{width:100%;height:700px;border:1px solid #aaa}</style>
<h1>Local production performance probe</h1>
<p>Three ordinary same-browser navigations. Cache and network are not controlled; these are diagnostic samples, not field metrics or Lighthouse scores.</p>
<pre id="report" role="status">Measuring…</pre>
<iframe id="page" title="Production page under measurement"></iframe>
<script>
  const path = new URLSearchParams(location.search).get('path') || '/';
  const frame = document.getElementById('page');
  const report = document.getElementById('report');
  const results = [];
  if (!path.startsWith('/') || path.startsWith('//')) throw new Error('Use a local absolute path');
  frame.onload = () => {
    const page = frame.contentWindow;
    const deadline = Date.now() + 15000;
    function waitForContent() {
      if (!page.document.querySelector('main:not(.hb-route-loading)') && Date.now() < deadline) {
        setTimeout(waitForContent, 25);
        return;
      }
      const contentReadyMs = Math.round(page.performance.now());
      setTimeout(() => measure(page, contentReadyMs), 300);
    }
    waitForContent();
  };
  function measure(page, contentReadyMs) {
    const nav = page.performance.getEntriesByType('navigation')[0];
    const resources = page.performance.getEntriesByType('resource');
    const scripts = resources.filter((item) => item.name.includes('/assets/') && new URL(item.name).pathname.endsWith('.js'));
    results.push({
      run: results.length + 1, path, title: page.document.title,
      domContentLoadedMs: Math.round(nav.domContentLoadedEventEnd),
      contentReadyMs,
      firstContentfulPaintMs: Math.round(page.performance.getEntriesByName('first-contentful-paint')[0]?.startTime || 0),
      localJSBytes: scripts.reduce((sum, item) => sum + item.decodedBodySize, 0),
      localJSRequests: scripts.length,
      localJSFiles: scripts.map((item) => new URL(item.name).pathname),
      modelRequested: scripts.some((item) => /model-viewer|CachingGLTFLoader/.test(item.name)),
      externalFontRequests: resources.filter((item) => /fonts\.(googleapis|gstatic)\.com/.test(item.name)).length,
    });
    report.textContent = JSON.stringify(results, null, 2);
    if (results.length < 3) next();
  }
  function next() {
    const url = new URL(path, location.origin);
    url.searchParams.set('auditRun', results.length + 1);
    frame.src = url.href;
  }
  next();
</script>
</html>
