<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved (or device) theme before first paint so there is no light flash.
      (function () {
        try {
          var theme = localStorage.getItem('hb-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" />
    <meta name="description" content="Discover Iraq’s heritage through interactive cards, maps, collections and source-backed site records with History in Cards." />
    <title>History in Cards</title>
  </head>

  <body>
    <div id="root"><main class="hb-page hb-route-loading"><div class="hb-container"><section class="hb-empty hb-state" role="status"><h1 class="hb-empty__title">Loading History in Cards</h1><p>Preparing the archive…</p></section></div></main></div>
    <noscript>Enable JavaScript to explore the interactive archive.</noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
